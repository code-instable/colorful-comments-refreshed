base: &base
  supportedLanguage: true
  ignoreFirstLine: false
  isPlainText: false
# * C style delimiters
c_delim: &c_delim
  !!merge <<: *base
  commentFormat: ["//", "/*", "*/"]
  highlightJSDoc: false
# 
js_doc_delim: &js_doc_delim
  !!merge <<: *c_delim
  highlightJSDoc: true
# 
css_delim: &css_delim
  !!merge <<: *base
  commentFormat: ["/*", "/*", "*/"]
# * hash (#) delimiters
hash_delim: &hash_delim
  !!merge <<: *base
  delimiter: "#"
# 
tcl_delim: &tcl_delim
  !!merge <<: *hash_delim
  ignoreFirstLine: true
# 
python_delim: &python_delim
  !!merge <<: *base
  commentFormat: ["#", '"""', '""""']
  # technically, python does not have block comments, but this is a convention
  # note that multi-line strings won't be highlighted then
#
nim_delim: &nim_delim
  !!merge <<: *base
  commentFormat: ["#", "#[", "]#"]
#
powershell_delim: &powershell_delim
  !!merge <<: *base
  commentFormat: ["#", "<#", "#>"]
#
terraform_format: &terraform_format
  !!merge <<: *base
  commentFormat: ["#", "/*", "*/"]
twig_format: &twig_format
  !!merge <<: *base
  commentFormat: ["{#", "{#", "#}"]
# $ added by allemand-instable
rmd_delim: &rmd_delim
  !!merge <<: *base
  #               R       markdown
  commentFormat: ["#", "<!--", "-->"]
# * dash (-) delimiters
double_dash_delim: &double_dash_delim
  !!merge <<: *base
  delimiter: "--"
sql_delim: &sql_delim
  !!merge <<: *base
  commentFormat: ["--", "/*", "*/"]
lua_format: &lua_format
  !!merge <<: *base
  commentFormat: ["--", "--[[", "]]"]
haskell_elm_format: &haskell_elm_format
  !!merge <<: *base
  commentFormat: ["--", "{-", "-}"]
applescript_delim: &applescript_delim
  !!merge <<: *base
  commentFormat: ["--", "(*", "*)"]
# * special char delimiters
single_quote_delim: &single_quote_delim
  !!merge <<: *base
  delimiter: "'"
double_slash_delim: &double_slash_delim
  !!merge <<: *base
  delimiter: "//"
bat_delim: &bat_delim
  !!merge <<: *base
  delimiter: "@REM"
percent_delim: &percent_delim
  !!merge <<: *base
  delimiter: "%"
markdown_latex_combined_delim: &markdown_latex_combined_delim
  !!merge <<: *base
  commentFormat: ["%", "<!--", "-->"]
semicolon_delim: &semicolon_delim
  !!merge <<: *base
  delimiter: ";"
ahk2: &ahk2
  !!merge <<: *base
  commentFormat: [";", "/*", "*/"]
fortran_delim: &fortran_delim
  !!merge <<: *base
  delimiter: "c"
sas_stata_format: &sas_stata_format
  !!merge <<: *base
  commentFormat: ["*", "/*", "*/"]
genstat_format: &genstat_format
  !!merge <<: *base
  commentFormat: ["\\", '"', '"']
asciidoc_format: &asciidoc_format
  !!merge <<: *base
  commentFormat: ["//", "////", "////"]
# * html style delimiters
html_format: &html_format
  !!merge <<: *base
  commentFormat: ["<!--", "<!--", "-->"]
cfml_format: &cfml_format
  !!merge <<: *base
  commentFormat: ["<!---", "<!---", "--->"]
astro_delim: &astro_delim
  !!merge <<: *base
  commentFormat: ["//", "<!--", "-->"]
# * regExp delimiters
# this.delimiter = this.escapeRegExp( ... )
cobol_delim: &cobol_delim
  !!merge <<: *base
  escapeRegExp: "*>"
# * plaintext
plaintext_delim: &plaintext_delim
  !!merge <<: *base
  isPlainText: true
  # if true
  # this.supportedLanguage = this.contributions.highlightPlainText;
# * Wolfram
parenthesis_star: &parenthesis_star
  !!merge <<: *base
  commentFormat: ["(*", "(*", "*)"]
# ! default
default_delim: &default_delim
  !!merge <<: *base
  supportedLanguage: false
# ——————————————————————————————————————————— #
language:
  # * js doc style delimiter
  javascript: *js_doc_delim
  typescript: *js_doc_delim
  javascriptreact: *js_doc_delim
  typescriptreact: *js_doc_delim
  apex: *js_doc_delim
  # * C style delimiter
  c: *c_delim
  cpp: *c_delim
  csharp: *c_delim
  # fix : missing
  objective-c: *c_delim
  objective-cpp: *c_delim
  dart: *c_delim
  flax: *c_delim
  fsharp: *c_delim
  go: *c_delim
  al: *c_delim
  groovy: *c_delim
  haxe: *c_delim
  java: *c_delim
  jsonc: *c_delim
  kotlin: *c_delim
  less: *c_delim
  pascal: *c_delim
  objectpascal: *c_delim
  php: *c_delim
  rust: *c_delim
  scala: *c_delim
  scss: *c_delim
  stylus: *c_delim
  swift: *c_delim
  verilog: *c_delim
  vue: *c_delim
  css: *css_delim
  # * hash (#) delimiter
  coffeescript: *hash_delim
  dockerfile: *hash_delim
  gdscript: *hash_delim
  graphql: *hash_delim
  julia: *hash_delim
  makefile: *hash_delim
  perl: *hash_delim
  perl6: *hash_delim
  puppet: *hash_delim
  r: *hash_delim
  ruby: *hash_delim
  shellscript: *hash_delim
  yaml: *hash_delim
  # $ python style delimiter
  python: *python_delim
  elixir: *python_delim
  snakemake: *python_delim # see https://github.com/snakemake/snakemake-lang-vscode-plugin/blob/master/package.json
  # $ other
  tcl: *tcl_delim
  nim: *nim_delim
  powershell: *powershell_delim
  # * dash delim
  ada: *double_dash_delim
  hive-sql: *double_dash_delim
  pig: *double_dash_delim
  plsql: *double_dash_delim
  # fixed by @xHorntail
  sql: *sql_delim
  # $ multiline
  lua: *lua_format
  elm: *haskell_elm_format
  haskell: *haskell_elm_format
  # * " delimiters
  diagram: *single_quote_delim
  vb: *single_quote_delim
  # * % delimiters
  bibtex: *percent_delim
  erlang: *percent_delim
  latex: *percent_delim
  matlab: *percent_delim
  # * ; delimiters
  clojure: *semicolon_delim
  racket: *semicolon_delim
  lisp: *semicolon_delim
  # * html style delimiters
  html: *html_format
  markdown: *html_format
  xml: *html_format
  # * standalone delimiters
  terraform: *terraform_format
  COBOL: *cobol_delim
  fortran-modern: *fortran_delim
  # 
  SAS: *sas_stata_format
  # extension : SAS.sas-lsp
  # onLanguage:sas
  sas: *sas_stata_format
  stata: *sas_stata_format
  twig: *twig_format
  genstat: *genstat_format
  cfml: *cfml_format
  asciidoc: *asciidoc_format
  # * default
  default: *default_delim
  # ~ added languages compared to original extension
  # https://github.com/Parth2031/Colorful-Comments
  astro: *astro_delim
  svelte: *astro_delim
  rmd: *rmd_delim
  json: *c_delim # same as jsonc even though there is no such thing as comment in json, but some files use jsonc convention but with .json in the end
  sass: *c_delim
  md: *html_format
  mojo: *python_delim
  markdown_latex_combined: *markdown_latex_combined_delim
  applescript: *applescript_delim
  ahk: *semicolon_delim
  ahk2: *ahk2
  gsc: *double_slash_delim
  # fix : missing
  plaintext: *plaintext_delim
  # > //, /*, */
  shaderlab: *c_delim
  d: *c_delim
  # > '
  brightscript: *single_quote_delim
  # $ language support requests
  # * QLIK
  # https://github.com/Parth2031/Colorful-Comments/issues/5
  # according to extension : Gimly81.qlik
  # github : https://github.com/Gimly/vscode-qlik
  qlik: *c_delim
  # * SystemVerilog
  # https://github.com/Parth2031/Colorful-Comments/issues/12
  # according to extension : mshr-h.veriloghdl
  # github : https://github.com/mshr-h/vscode-verilog-hdl-support
  systemverilog: *c_delim
  vhdl: *double_dash_delim
  ignore: *hash_delim
  bat: *bat_delim
  # * KDL config files (zellij)
  kdl: *c_delim
  wolfram: *parenthesis_star
  nix: *terraform_format
  # https://github.com/allemand-instable/colorful-comments-refreshed/issues/12
  toml: *hash_delim
